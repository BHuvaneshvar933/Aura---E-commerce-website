services:
  # 1. Managed PostgreSQL Database
  - type: pgo
    name: aura-db
    databaseName: ecommerce_db
    user: aura_admin
    plan: free # Note: Render free databases expire after 90 days. Upgrade to starter if needed.

  # 2. Managed Redis
  - type: redis
    name: aura-redis
    plan: free

  # 3. FastAPI Backend
  - type: web
    name: aura-api
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aura-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aura-redis
          property: port
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: 1440
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_STARTTLS
        value: "True"
      - key: MAIL_SSL_TLS
        value: "False"
      - key: EMAIL_VERIFY_BASE_URL
        value: "https://your-frontend-url-here.vercel.app" # You will need to change this later
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_SECRET_KEY
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false

  # 4. Celery Worker
  - type: worker
    name: aura-worker
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A app.worker.celery_app worker --loglevel=info
    plan: free
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: aura-db
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: redis
          name: aura-redis
          property: host
      - key: REDIS_PORT
        fromService:
          type: redis
          name: aura-redis
          property: port
      - key: MAIL_USERNAME
        sync: false
      - key: MAIL_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
      - key: MAIL_PORT
        value: 587
      - key: MAIL_SERVER
        value: smtp.gmail.com
      - key: MAIL_STARTTLS
        value: "True"
      - key: MAIL_SSL_TLS
        value: "False"
      - key: EMAIL_VERIFY_BASE_URL
        value: "https://your-frontend-url-here.vercel.app"
